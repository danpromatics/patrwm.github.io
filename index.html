<!DOCTYPE html>
<html lang="cy">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://www.patrwmgolf.co.uk" />
    <meta name="apple-mobile-web-app-title" content="Patrwm" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="title" property="og:title" content="Patrwm - Gorchudd o Gymru.">
    <meta name="description" property="og:description" content="Premium golf headcovers handcrafted using traditional Welsh woolen fabrics.">
  
    <meta property="og:url" content="https://danpromatics.github.io/patrwm.github.io" />
    
    <meta name="image" property="og:image" content="https://danpromatics.github.io/patrwm.github.io/seo-banner.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Patrwm Golf Headcovers logo." />
    <meta property="og:site_name" content="Patrwm Golf" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <meta name="theme-color" content="#323523">
    
    <script type="application/ld+json">
    {
      "@context": "https://www.patrwmgolf.co.uk",
      "@type": "Patrwm Golf",
      "name": "Patrwm Golf Homepage",
      "description": "Premium golf headcovers handcrafted using traditional Welsh woolen fabrics."
    }
    </script>
    <title lang="en">Patrwm Golf</title>
  </head>

  <body>
    <main>
      <img src="title.svg" alt="Patrwm. Gorchudd O Gymru." />
      <span>
        <img src="coming-soon.svg" alt="Coming soon." />
        <a href="https://www.instagram.com/patrwmgolf">
          <i class="bi bi-instagram"></i>
        </a>
      </span>
    </main>
  </body>

  <script type="text/javascript">
    const appHeight = () => {
    const doc = document.documentElement
      doc.style.setProperty('--app-height', `${window.innerHeight}px`)
    }
    window.addEventListener('resize', appHeight)
    appHeight()
  </script>
  
  <style>
    body {
      background-color: #323523;
      margin: 0;
    }
    :root {
      --app-height: 100%;
    }

    * { 
      box-sizing: border-box;
    }
    
    html,
    body {
      padding: 0;
      margin: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: var(--app-height);
    }

    main {
      background: #323523 url("background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }
  
    img {
      max-width: min(80vw, 1050px);
      height: auto
      
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -o-user-select: none;
      user-select: none;
    }
    i{
      color:#eae5df;
    }
  </style>
</html>
